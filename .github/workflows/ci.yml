name: Atlas CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile integrity checker
        run: python -m py_compile scripts/check_site.py

      - name: Check site links and assets
        run: python scripts/check_site.py
