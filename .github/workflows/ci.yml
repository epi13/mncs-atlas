name: Atlas CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile site tooling
        run: python -m py_compile scripts/check_site.py scripts/sync_pages_root.py

      - name: Check Pages root mirror
        run: python scripts/sync_pages_root.py --check

      - name: Check site links, assets, and machine map
        run: python scripts/check_site.py
