name: Atlas Journal Maintainer

# One maintainer implementation; this is an invocation surface.
# Collection/triage is deterministic Atlas infrastructure. A capable editor
# may supply an EvidenceBundle-backed draft; this scheduled job defaults to
# PR creation and never claims that the heuristic authored the narrative.

on:
  schedule:
    - cron: "17 17 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Gather and synthesize without opening a PR"
        type: boolean
        default: true
      retry:
        description: "Retry the current uncovered interval"
        type: boolean
        default: false
      synthesizer:
        description: "heuristic = triage/fallback; editor-draft requires a draft file checked into the run"
        type: choice
        default: heuristic
        options:
          - heuristic
          - editor-draft
      draft_file:
        description: "Path to an EvidenceBundle-bound editor draft JSON (required when synthesizer=editor-draft)"
        type: string
        default: ""

concurrency:
  group: atlas-journal-maintainer
  cancel-in-progress: false

# The producer pushes one journal-only branch, opens/updates its PR, and
# attaches the journal-maintainer label. Nothing here merges.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - name: Mint narrowly scoped GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MNCS_JOURNAL_APP_ID }}
          private-key: ${{ secrets.MNCS_JOURNAL_APP_PRIVATE_KEY }}
          owner: epi13
          repositories: mncs-atlas
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.MNCS_JOURNAL_APP_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine invocation
        id: mode
        env:
          SYNTHESIZER: ${{ inputs.synthesizer || 'heuristic' }}
          DRAFT_FILE: ${{ inputs.draft_file }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "args=run --publish --mode pr-only --json" >> "$GITHUB_OUTPUT"
          else
            echo "args=run --dry-run --json" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.retry }}" = "true" ]; then
            echo "retry=--retry" >> "$GITHUB_OUTPUT"
          else
            echo "retry=" >> "$GITHUB_OUTPUT"
          fi
          # The scheduled model/editor path is explicit: heuristic output is
          # triage/fallback and is labeled as such; editor-draft runs must be
          # handed a real draft file or the run fails closed.
          echo "synthesizer=${SYNTHESIZER}" >> "$GITHUB_OUTPUT"
          if [ "${SYNTHESIZER}" = "editor-draft" ]; then
            if [ -z "${DRAFT_FILE}" ] || [ ! -f "${DRAFT_FILE}" ]; then
              echo "synthesizer=editor-draft requires --draft-file pointing at an existing EvidenceBundle-bound draft"; exit 1
            fi
            echo "draft_arg=--draft-file ${DRAFT_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "draft_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Journal Maintainer
        env:
          MNCS_JOURNAL_APP_TOKEN: ${{ steps.app-token.outputs.token || secrets.MNCS_JOURNAL_APP_TOKEN }}
          MNCS_COMMONS_URL: ${{ secrets.MNCS_COMMONS_URL }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            test -n "$MNCS_JOURNAL_APP_TOKEN" || { echo "MNCS_JOURNAL_APP_TOKEN is required for unattended PR creation"; exit 1; }
          fi
          python -m journal_maintainer ${{ steps.mode.outputs.args }} --synthesizer ${{ steps.mode.outputs.synthesizer }} ${{ steps.mode.outputs.draft_arg }} ${{ steps.mode.outputs.retry }}

      - name: Record no-op / provenance in the job summary
        if: always()
        run: |
          echo "Journal Maintainer invocation completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Synthesizer path: \`${{ steps.mode.outputs.synthesizer }}\` (heuristic output is triage, never model-authored)." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow invokes \`python -m journal_maintainer\`. It does not embed a second editorial implementation." >> "$GITHUB_STEP_SUMMARY"
          echo "Commons is consulted only when \`MNCS_COMMONS_URL\` is configured; otherwise the gap is recorded and repository evidence may still suffice." >> "$GITHUB_STEP_SUMMARY"
          echo "Control journal context is a local/operator surface; scheduled cloud runs record it as unavailable unless an exported bundle is supplied." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow creates/updates PRs only. Independent finalizer re-evaluates the exact head after Atlas CI; missing App configuration fails closed." >> "$GITHUB_STEP_SUMMARY"
